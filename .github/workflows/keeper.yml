name: keeper

# Barre las creator fees de los vaults de RobinShare, cada 15 minutos.
#
# POR QUE ACA Y NO EN VERCEL. La ruta es /api/cron/keeper y vive en Vercel, pero el plan Hobby
# **solo permite crons DIARIOS**: `*/15 * * * *` hace fallar el deploy entero con
# "Hobby accounts are limited to daily cron jobs". Con 24 h de espera, las fees se quedan en la
# curva todo el dia — y ese saldo sin barrer es exactamente lo que el owner de pons puede
# reapuntar retroactivamente.
#
# GitHub Actions corre schedules gratis en repos publicos. `vercel.json` conserva ademas un cron
# DIARIO como piso: si este workflow se rompe o se desactiva, el barrido sigue ocurriendo, tarde
# pero ocurre.
#
# OJO: los schedules de GitHub se retrasan bajo carga (a veces bastante). Es un barrido oportunista,
# no un SLA — y esta bien, porque `harvest()` es idempotente: si no hay nada que barrer, la pasada
# no gasta gas.
#
# PARA PRENDERLO hacen falta dos secrets del repo (Settings -> Secrets and variables -> Actions):
#   KEEPER_URL     https://www.robinshareapp.com/api/cron/keeper
#   CRON_SECRET    el mismo valor que esta en Vercel
# Sin ellos el workflow no falla: se saltea y lo dice.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # para poder dispararlo a mano desde la pestaña Actions

# Sin esto, dos corridas superpuestas mandarian dos `harvest()` a la vez sobre el mismo vault: la
# segunda barre cero y paga el gas igual.
concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: barrer las fees hacia los vaults
        env:
          KEEPER_URL: ${{ secrets.KEEPER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPER_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets KEEPER_URL y/o CRON_SECRET — el keeper esta apagado."
            echo "Se configuran en Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          # -sS muestra errores pero no la barra de progreso; --fail-with-body deja ver el cuerpo
          # cuando el endpoint responde 4xx/5xx, que es justo cuando hace falta leerlo.
          code=$(curl -sS --max-time 120 --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o respuesta.json -w "%{http_code}" "$KEEPER_URL") || true
          echo "HTTP $code"
          cat respuesta.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::el keeper respondio $code"
            exit 1
          fi
          # Un vault REDIRIGIDO significa que el owner de pons reapunto las creator fees y este
          # keeper ya no puede barrer esa curva. Es el evento contra el que el keeper existe, asi
          # que tiene que verse en rojo y no perderse en el log.
          if grep -q '"alertas":\[[^]]' respuesta.json; then
            echo "::error::hay vaults con las fees REDIRIGIDAS — revisar"
            exit 1
          fi
